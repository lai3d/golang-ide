name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bundle GoIDE.app
        run: ./scripts/bundle.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/GoIDE.zip \
            --title "GoIDE $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Ad-hoc signed build: the first time, right-click GoIDE.app and choose Open (or run: xattr -dr com.apple.quarantine GoIDE.app). Requires macOS 14+, Go, gopls and dlv."
